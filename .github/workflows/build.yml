name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 빌드 환경 고정: iOS 26 SDK (iOS 27 SDK는 전체 화면 동작이 바뀌어서 아직 안 씀)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # 보안 벽: 금지된 코드(인터넷 직접 접속, 로그, 클립보드, 위장 등)가 있으면 여기서 멈춤
      - name: Security check
        run: bash scripts/security-check.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee xcodegen.log

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GFNRumble.xcodeproj \
            -target GFNRumble \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            build 2>&1 | tee build.log

      # 컴파일 오류를 공개 주석(annotation)으로 남겨서 바로 볼 수 있게
      - name: Report compile errors
        if: failure()
        run: |
          grep -E ': error: ' build.log | sort -u | head -n 40 | while IFS= read -r line; do
            echo "::error::${line#$PWD/}"
          done || true

      - name: Package IPA
        run: |
          APP="build/Release-iphoneos/GFNRumble.app"
          test -d "$APP"
          test -f "$APP/rumble-bridge.js"
          test -f "$APP/GFNRumble"   # 실행 파일이 없으면 실패
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr GFNRumble.ipa Payload

      # SideStore 소스: 한 번 등록하면 SideStore에서 'Update'로 덮어쓰기 설치 (로그인 유지)
      - name: Make SideStore source
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = os.environ["RUN"]; repo = os.environ["REPO"]
          size = os.path.getsize("GFNRumble.ipa")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          source = {
            "name": "GFN Rumble",
            "identifier": "io.github.lunorsun.gfnrumble",
            "subtitle": "지포스 나우 진동 앱",
            "apps": [{
              "name": "GFN Rumble",
              "bundleIdentifier": "com.gfnrumble.app",
              "developerName": "Lunorsun",
              "subtitle": "지포스 나우에 컨트롤러 진동을 더해요",
              "localizedDescription": "아이패드 지포스 나우용 진동·햅틱 앱",
              "iconURL": f"https://opengraph.githubassets.com/1/{repo}",
              "tintColor": "76B900",
              "category": "utilities",
              "versions": [{
                "version": f"1.0.{run}",
                "buildVersion": run,
                "date": now,
                "localizedDescription": f"빌드 {run}",
                "downloadURL": f"https://github.com/{repo}/releases/download/build-{run}/GFNRumble.ipa",
                "size": size,
                "minOSVersion": "15.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          json.dump(source, open("source.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cat source.json

      # 실패하면 오류 내용을 실행 결과 첫 화면(Summary)에 적어 둡니다.
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## 빌드 실패 요약"
            for f in xcodegen.log build.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                grep -E "error|Error|FAILED" "$f" | sort -u | head -n 60 || true
                echo "--- 마지막 30줄 ---"
                tail -n 30 "$f"
                echo '```'
              fi
            done
            echo "### 빌드 폴더"
            echo '```'
            ls -R build 2>/dev/null | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFNRumble-ipa
          path: GFNRumble.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GFN 진동 빌드 ${{ github.run_number }}
          files: |
            GFNRumble.ipa
            source.json
