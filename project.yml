# XcodeGen 설정: 이 파일로 Xcode 프로젝트를 자동 생성합니다 (GitHub Actions에서 실행).
name: GFNRumble

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  GFNRumble:
    type: application
    platform: iOS
    sources:
      - path: GFNRumble
    info:
      path: GFNRumble/Info.plist
      properties:
        # 영문만 씁니다. SideStore가 이 이름으로 Apple에 앱을 등록하는데, 한글은 거부됩니다.
        CFBundleDisplayName: GFN Rumble
        # 빌드 번호는 GitHub 빌드가 넣어 줍니다 (SideStore 업데이트가 이 번호로 확인)
        # 아이패드 게임 모드: 블루투스 컨트롤러를 더 자주 읽어 입력 지연·씹힘을 줄입니다.
        LSApplicationCategoryType: public.app-category.games
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            # TV 모드(실험): 외부 화면 장면
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        NSMicrophoneUsageDescription: 지포스 나우에서 음성 채팅을 켰을 때만 마이크를 사용합니다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: GFNRumble
        PRODUCT_BUNDLE_IDENTIFIER: com.gfnrumble.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        # 서명 없이 빌드합니다. 서명은 아이패드의 SideStore가 본인 Apple ID로 합니다.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
