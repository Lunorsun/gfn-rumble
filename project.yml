# XcodeGen 설정: 이 파일로 Xcode 프로젝트를 자동 생성합니다 (GitHub Actions에서 실행).
name: GFNRumble

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  GFNRumble:
    type: application
    platform: iOS
    sources:
      - path: GFNRumble
    info:
      path: GFNRumble/Info.plist
      properties:
        CFBundleDisplayName: GFN 진동
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSMicrophoneUsageDescription: 지포스 나우에서 음성 채팅을 켰을 때만 마이크를 사용합니다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: GFNRumble
        PRODUCT_BUNDLE_IDENTIFIER: com.gfnrumble.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        # 서명 없이 빌드합니다. 서명은 아이패드의 SideStore가 본인 Apple ID로 합니다.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
